<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-title" content="CTPCC" />
  <meta name="description" content="Codename to Psych Character Converter is a tool that lets you easily convert Codename XML to Psych JSON character!">
  <meta name="robots" content="notranslate">
  <meta name="keywords" content="fnf, friday night funkin, psych engine, codename engine, character, converter, xml, json"/>
  <title>Codename to Psych Character Converter (web version)</title>
  <link rel="manifest" href="assets/site.webmanifest" />
  <link rel="icon" type="image/png" href="assets/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="shortcut icon" href="assets/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1c1b1f;
      font-family: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #e6e1e5;
    }

    .md3-card {
      max-width: 960px;
      width: 100%;
      background: #2b2a30;
      border-radius: 28px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
      overflow: hidden;
      transition: 0.2s;
      backdrop-filter: blur(2px);
    }

    .md3-header {
      padding: 24px 28px 16px 28px;
      background: #32313a;
      border-bottom: 1px solid #41404a;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .md3-header .icon-head {
      color: #d0f0c0;
    }

    .md3-header h1 {
      font-weight: 500;
      font-size: 1.5rem;
      letter-spacing: 0.2px;
      background: linear-gradient(145deg, #c8f0b8, #7ecf8a);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .md3-content {
      padding: 28px 28px 20px;
    }

    .drop-zone {
      background: #222128;
      border: 2px dashed #4f4d5a;
      border-radius: 24px;
      padding: 36px 20px;
      text-align: center;
      transition: 0.2s;
      margin-bottom: 24px;
      cursor: default;
    }

    .drop-zone.drag-over {
      border-color: #94d89a;
      background: #2b3a2b;
      transform: scale(0.98);
    }

    .drop-zone .big-icon {
      font-size: 2.8rem;
      color: #94d89a;
    }

    .drop-zone p {
      color: #cbc6d0;
      font-size: 1rem;
      margin: 8px 0 4px;
    }

    .drop-zone .hint {
      color: #8a8592;
      font-size: 0.85rem;
    }

    .file-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 18px 0 18px;
      max-height: 240px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .file-chip {
      background: #1f1e25;
      border-radius: 40px;
      padding: 8px 16px 8px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #3d3c47;
      transition: 0.15s;
    }

    .file-chip .status-icon {
      font-size: 1.2rem;
      line-height: 1;
      width: 24px;
      text-align: center;
    }

    .file-chip .fname {
      flex: 1;
      font-family: 'Roboto Mono', monospace;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #e6e1e5;
    }

    .file-chip .fsize {
      color: #9994a1;
      font-size: 0.7rem;
      font-weight: 400;
      background: #32313b;
      padding: 2px 10px;
      border-radius: 40px;
    }

    .file-chip .remove-btn {
      background: transparent;
      border: none;
      color: #e6b3b3;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 40px;
      transition: 0.2s;
      display: flex;
      align-items: center;
    }

    .file-chip .remove-btn:hover {
      background: #3f2e2e;
      color: #ffbaba;
    }

    .file-chip.converting {
      border-left: 6px solid #f2b86b;
      background: #2f2b1e;
    }
    .file-chip.success {
      border-left: 6px solid #7ecf8a;
      background: #1f2f1f;
    }
    .file-chip.error {
      border-left: 6px solid #e67a7a;
      background: #2f1f1f;
    }

    .empty-message {
      color: #7b7682;
      text-align: center;
      padding: 28px 12px;
      font-size: 0.95rem;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 6px;
    }

    .md3-btn {
      background: #3e3d48;
      border: none;
      border-radius: 40px;
      padding: 10px 24px;
      font-family: 'Roboto', sans-serif;
      font-weight: 500;
      font-size: 0.9rem;
      color: #e6e1e5;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
      letter-spacing: 0.2px;
    }

    .md3-btn:hover:not(:disabled) {
      background: #4e4d5a;
      transform: scale(0.97);
    }

    .md3-btn:active:not(:disabled) {
      transform: scale(0.94);
    }

    .md3-btn .icon {
      font-size: 1.2rem;
    }

    .btn-primary {
      background: #4b8a4f;
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      background: #3e7a42;
    }

    .btn-danger {
      background: #7a4a4a;
    }
    .btn-danger:hover:not(:disabled) {
      background: #6a3d3d;
    }

    .md3-btn:disabled {
      opacity: 0.4;
      transform: none;
      cursor: not-allowed;
    }

    .progress-section {
      background: #1e1d24;
      border-radius: 40px;
      padding: 8px 18px 8px 20px;
      margin: 22px 0 14px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      border: 1px solid #3f3e49;
      transition: 0.2s;
    }

    .progress-bar {
      flex: 1;
      height: 6px;
      background: #3a3943;
      border-radius: 40px;
      overflow: hidden;
      min-width: 80px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #7ecf8a;
      border-radius: 40px;
      transition: width 0.25s ease;
    }

    .status-msg {
      font-size: 0.8rem;
      font-weight: 400;
      color: #cbc6d0;
      min-width: 120px;
      font-family: 'Roboto Mono', monospace;
      white-space: nowrap;
    }

    .status-msg.error { color: #f09a9a; }
    .status-msg.success { color: #a8e0b0; }

    .stats-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 28px;
      background: #1b1a21;
      padding: 14px 20px;
      border-radius: 48px;
      margin: 10px 0 20px;
      border: 1px solid #3a3944;
      justify-content: space-around;
    }

    .stat-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .stat-number {
      font-size: 1.4rem;
      font-weight: 600;
      color: #b8f0c0;
      letter-spacing: 0.5px;
    }

    .stat-label {
      color: #9e99a6;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .convert-wide {
      width: 100%;
      justify-content: center;
      padding: 14px;
      font-size: 1.1rem;
      margin-top: 4px;
      background: #3d8a41;
    }
    .convert-wide:hover:not(:disabled) {
      background: #317a35;
    }

    .file-grid::-webkit-scrollbar {
      width: 4px;
    }
    .file-grid::-webkit-scrollbar-thumb {
      background: #595764;
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      .md3-header h1 { font-size: 1.2rem; }
      .md3-header .sub { margin-left: 0; width: 100%; text-align: center; }
      .stats-pills { gap: 12px; }
    }
  </style>
</head>
<body>
  <div class="md3-card">
    <div class="md3-header">
      <span class="material-symbols-outlined icon-head">transform</span>
      <h1>Codename to Psych Character Converter</h1>
    </div>

    <div class="md3-content">
      <div class="drop-zone" id="dropZone">
        <div class="big-icon material-symbols-outlined">cloud_upload</div>
        <p>Drag & drop XML file(s) here</p>
        <span class="hint">or use Add file(s) below</span>
      </div>

      <div class="file-grid" id="fileListContainer">
        <div class="empty-message">No file(s) selected</div>
      </div>

      <div class="action-row">
        <button class="md3-btn btn-danger" id="clearBtn">
          <span class="material-symbols-outlined icon">delete</span> Clear all
        </button>
        <button class="md3-btn" id="addBtn">
          <span class="material-symbols-outlined icon">add</span> Add file(s)
        </button>
        <input type="file" id="fileInput" multiple accept=".xml" style="display: none;" />
        <div style="flex:1; min-width:20px;"></div>
        <button class="md3-btn btn-primary convert-wide" id="convertBtn" disabled>
          <span class="material-symbols-outlined">play_arrow</span> Convert
        </button>
      </div>

      <div class="progress-section" id="progressArea" style="display: none;">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="status-msg" id="statusMsg">Ready</div>
      </div>

      <div class="stats-pills" id="statsArea" style="display: none;">
        <div class="stat-item"><span class="stat-number" id="statTotal">0</span><span class="stat-label">total</span></div>
        <div class="stat-item"><span class="stat-number" id="statSuccess">0</span><span class="stat-label">converted</span></div>
        <div class="stat-item"><span class="stat-number" id="statFailed">0</span><span class="stat-label">failed</span></div>
        <div class="stat-item"><span class="stat-number" id="statCurrent">0</span><span class="stat-label">current</span></div>
      </div>
    </div>

  <script>
    (function() {
      const dropZone = document.getElementById('dropZone');
      const fileInput = document.getElementById('fileInput');
      const addBtn = document.getElementById('addBtn');
      const clearBtn = document.getElementById('clearBtn');
      const fileListContainer = document.getElementById('fileListContainer');
      const convertBtn = document.getElementById('convertBtn');
      const progressArea = document.getElementById('progressArea');
      const progressFill = document.getElementById('progressFill');
      const statusMsg = document.getElementById('statusMsg');
      const statsArea = document.getElementById('statsArea');
      const statTotal = document.getElementById('statTotal');
      const statSuccess = document.getElementById('statSuccess');
      const statFailed = document.getElementById('statFailed');
      const statCurrent = document.getElementById('statCurrent');

      let selectedFiles = [];
      let fileContents = new Map();
      let fileStatus = new Map();
      let isConverting = false;
      let successCount = 0, failCount = 0;
      let fileSystemSupported = null;

      function escapeHtml(str) {
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
      }

      function getStatusIcon(status) {
        switch(status) {
          case 'converting': return '⏳';
          case 'success': return '✅';
          case 'error': return '❌';
          default: return '🕒';
        }
      }

      function updateStatusMessage(text, type = 'info') {
        statusMsg.textContent = text;
        statusMsg.classList.remove('error', 'success');
        if (type === 'error') statusMsg.classList.add('error');
        else if (type === 'success') statusMsg.classList.add('success');
      }

      function updateStats() {
        statTotal.textContent = selectedFiles.length;
        statSuccess.textContent = successCount;
        statFailed.textContent = failCount;
        const converting = Array.from(fileStatus.values()).filter(v => v === 'converting').length;
        statCurrent.textContent = converting;
        statsArea.style.display = (selectedFiles.length > 0) ? 'flex' : 'none';
      }

      function renderFileList() {
        if (selectedFiles.length === 0) {
          fileListContainer.innerHTML = `<div class="empty-message">No file(s) selected</div>`;
          convertBtn.disabled = true;
          statsArea.style.display = 'none';
          return;
        }
        convertBtn.disabled = false;
        statsArea.style.display = 'flex';
        statTotal.textContent = selectedFiles.length;

        let html = '';
        selectedFiles.forEach((file, idx) => {
          const status = fileStatus.get(file.name) || 'pending';
          const sizeKB = (file.size / 1024).toFixed(1);
          html += `
            <div class="file-chip ${status}" data-filename="${file.name}">
              <span class="status-icon">${getStatusIcon(status)}</span>
              <span class="fname">${escapeHtml(file.name)}</span>
              <span class="fsize">${sizeKB} KB</span>
              <button class="remove-btn" data-index="${idx}" ${isConverting ? 'disabled' : ''}>
                <span class="material-symbols-outlined" style="font-size:1.2rem;">close</span>
              </button>
            </div>
          `;
        });
        fileListContainer.innerHTML = html;

        if (!isConverting) {
          document.querySelectorAll('.remove-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
              const idx = parseInt(btn.dataset.index);
              removeFile(idx);
            });
          });
        }
        updateStats();
      }

      function updateFileChipStatus(filename, status) {
        const chip = document.querySelector(`.file-chip[data-filename="${filename}"]`);
        if (chip) {
          chip.className = `file-chip ${status}`;
          const iconSpan = chip.querySelector('.status-icon');
          if (iconSpan) iconSpan.textContent = getStatusIcon(status);
        }
        fileStatus.set(filename, status);
        updateStats();
      }

      function removeFile(index) {
        if (isConverting) {
          updateStatusMessage('Cannot remove during conversion', 'error');
          return;
        }
        const removed = selectedFiles[index];
        if (!removed) return;
        selectedFiles.splice(index, 1);
        fileContents.delete(removed.name);
        fileStatus.delete(removed.name);
        renderFileList();
        updateStatusMessage(`Removed ${removed.name}`, 'info');
      }

      function clearAll() {
        if (isConverting) {
          updateStatusMessage('Cannot clear during conversion', 'error');
          return;
        }
        selectedFiles = [];
        fileContents.clear();
        fileStatus.clear();
        successCount = 0; failCount = 0;
        renderFileList();
        updateStatusMessage('Cleared all files', 'info');
        progressArea.style.display = 'none';
        progressFill.style.width = '0%';
      }

      function addFiles(files) {
        const valid = Array.from(files).filter(f => {
          if (!f.name.toLowerCase().endsWith('.xml')) {
            updateStatusMessage(`Skipped "${f.name}" (not XML)`, 'error');
            return false;
          }
          if (selectedFiles.some(ex => ex.name === f.name)) {
            updateStatusMessage(`Skipped "${f.name}" (already added)`, 'error');
            return false;
          }
          return true;
        });
        if (valid.length === 0) return;

        valid.forEach(file => {
          selectedFiles.push(file);
          fileStatus.set(file.name, 'pending');
          const reader = new FileReader();
          reader.onload = (e) => {
            fileContents.set(file.name, e.target.result);
            updateFileChipStatus(file.name, 'pending');
            updateStatusMessage(`Loaded "${file.name}"`, 'success');
          };
          reader.onerror = () => {
            updateStatusMessage(`Failed to read "${file.name}"`, 'error');
            const idx = selectedFiles.findIndex(f => f.name === file.name);
            if (idx !== -1) {
              selectedFiles.splice(idx, 1);
              fileStatus.delete(file.name);
              renderFileList();
            }
          };
          reader.readAsText(file, 'UTF-8');
        });

        renderFileList();
        updateStatusMessage(`Added ${valid.length} file(s)`, 'success');
      }

      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (!isConverting) dropZone.classList.add('drag-over');
      });
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        if (isConverting) {
          updateStatusMessage('Cannot add during conversion', 'error');
          return;
        }
        if (e.dataTransfer.files.length) addFiles(Array.from(e.dataTransfer.files));
      });

      addBtn.addEventListener('click', () => { if (!isConverting) fileInput.click(); });
      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) {
          addFiles(Array.from(e.target.files));
          fileInput.value = '';
        }
      });
      clearBtn.addEventListener('click', clearAll);

      function hexToRgb(hexColor) {
        let hex = hexColor.replace('#','');
        if (hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
        try {
          const r = parseInt(hex.substring(0,2),16);
          const g = parseInt(hex.substring(2,4),16);
          const b = parseInt(hex.substring(4,6),16);
          if (isNaN(r)||isNaN(g)||isNaN(b)) return [161,161,161];
          return [r,g,b];
        } catch { return [161,161,161]; }
      }

      function parseIndices(str) {
        if (!str) return [];
        const res = new Set();
        const parts = str.split(',');
        for (let part of parts) {
          part = part.trim();
          if (part.includes('..')) {
            const [start, end] = part.split('..').map(Number);
            if (!isNaN(start) && !isNaN(end)) for (let i=start; i<=end; i++) res.add(i);
          } else if (!isNaN(Number(part))) res.add(Number(part));
        }
        return Array.from(res).sort((a,b)=>a-b);
      }

      function getAttr(el, name, def=null) { return el.getAttribute(name) ?? def; }
      function getFloat(el, name, def) { const v=el.getAttribute(name); return v===null?def:parseFloat(v)||def; }
      function getBool(el, name, def) { const v=el.getAttribute(name); return v===null?def:['true','1','yes'].includes(v.toLowerCase()); }

      function convertXmlToPsych(xmlString) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(xmlString, 'text/xml');
        const err = doc.querySelector('parsererror');
        if (err) throw new Error('Invalid XML: ' + err.textContent);
        const root = doc.documentElement;
        if (root.tagName !== 'character') throw new Error('Root must be <character>');

        const x = getFloat(root, 'x', 0), y = getFloat(root, 'y', 0);
        const sprite = getAttr(root, 'sprite', 'characters/BOYFRIEND');
        const scale = getFloat(root, 'scale', 1);
        const camx = getFloat(root, 'camx', 0), camy = getFloat(root, 'camy', 0);
        const icon = getAttr(root, 'icon', 'face');
        const holdTime = getFloat(root, 'holdTime', 4);
        const flipX = getBool(root, 'flipX', false);
        const colorHex = getAttr(root, 'color', '#A1A1A1');
        const rgb = hexToRgb(colorHex);

        const anims = root.querySelectorAll('anim');
        const psychAnims = [];
        for (let a of anims) {
          const name = getAttr(a, 'name', '');
          const anim = getAttr(a, 'anim', '');
          const ax = getFloat(a, 'x', 0), ay = getFloat(a, 'y', 0);
          const fps = Math.round(getFloat(a, 'fps', 24));
          const loop = getBool(a, 'loop', false);
          const indicesRaw = getAttr(a, 'indices', null);
          const indices = indicesRaw ? parseIndices(indicesRaw) : [];
          psychAnims.push({
            anim: name, name: anim, fps, loop, indices,
            offsets: [parseInt(ax), parseInt(ay)]
          });
        }

        return {
          animations: psychAnims,
          image: "characters/" + sprite,
          scale: scale,
          sing_duration: holdTime,
          healthicon: icon,
          position: [x, y],
          camera_position: [camx, camy],
          flip_x: flipX,
          no_antialiasing: false,
          healthbar_colors: rgb,
          vocals_file: null
        };
      }

      async function saveFile(content, defaultName) {
        if (fileSystemSupported === null) fileSystemSupported = 'showSaveFilePicker' in window;
        if (fileSystemSupported) {
          try {
            const handle = await window.showSaveFilePicker({
              suggestedName: defaultName,
              types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
            });
            const w = await handle.createWritable();
            await w.write(content);
            await w.close();
            return { success: true, name: handle.name };
          } catch (err) {
            if (err.name !== 'AbortError') return { success: false, error: err.message };
            return { success: false, cancelled: true };
          }
        } else {
          const blob = new Blob([content], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = defaultName;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          URL.revokeObjectURL(url);
          return { success: true, name: defaultName };
        }
      }

      async function startConversion() {
        if (isConverting) return;
        if (selectedFiles.length === 0) {
          updateStatusMessage('No files to convert', 'error');
          return;
        }
        const missing = selectedFiles.filter(f => !fileContents.has(f.name));
        if (missing.length) {
          updateStatusMessage(`Waiting for ${missing.length} file(s) to load`, 'error');
          return;
        }

        isConverting = true;
        convertBtn.disabled = true;
        clearBtn.disabled = true;
        addBtn.disabled = true;
        progressArea.style.display = 'flex';
        successCount = 0; failCount = 0;
        const total = selectedFiles.length;

        for (let i = 0; i < selectedFiles.length; i++) {
          const file = selectedFiles[i];
          const xml = fileContents.get(file.name);
          progressFill.style.width = `${(i/total)*100}%`;
          updateStatusMessage(`Converting ${i+1}/${total}: ${file.name}`, 'info');

          updateFileChipStatus(file.name, 'converting');
          updateStats();

          try {
            const jsonObj = convertXmlToPsych(xml);
            const jsonStr = JSON.stringify(jsonObj, null, 2);
            const outName = file.name.replace(/\.xml$/i, '.json');
            const result = await saveFile(jsonStr, outName);

            if (result.success) {
              successCount++;
              updateFileChipStatus(file.name, 'success');
              updateStatusMessage(`Converted: ${file.name}`, 'success');
            } else if (!result.cancelled) {
              failCount++;
              updateFileChipStatus(file.name, 'error');
              updateStatusMessage(`Failed: ${file.name}`, 'error');
            } else {
              updateStatusMessage('Cancelled by user', 'error');
              break;
            }
          } catch (err) {
            failCount++;
            updateFileChipStatus(file.name, 'error');
            updateStatusMessage(`Error: ${err.message}`, 'error');
          }
          updateStats();
        }

        progressFill.style.width = '100%';
        if (successCount === total) updateStatusMessage(`All ${successCount} converted!`, 'success');
        else if (successCount) updateStatusMessage(`${successCount} ok, ${failCount} failed`, 'info');
        else updateStatusMessage('No files converted', 'error');

        setTimeout(() => { progressArea.style.display = 'none'; progressFill.style.width = '0%'; }, 2800);
        isConverting = false;
        convertBtn.disabled = false;
        clearBtn.disabled = false;
        addBtn.disabled = false;
      }

      convertBtn.addEventListener('click', startConversion);

      renderFileList();
    })();
  </script>
</body>
</html>
